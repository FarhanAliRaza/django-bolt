name: CodSpeed

# Performance of the production request path, as CPU instructions per request.
# CodSpeed runs the benchmarks under CPU simulation. A count does not change
# with the load of the runner, so a small change in a pull request shows.
# The benchmarks and their measured noise: python/benchmark/conftest.py.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # CodSpeed identifies the repository with an OIDC token. It needs no secret.
  id-token: write

# One group per pull request: a new push cancels the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      # The newest supported Python, as CI.yml and coverage.yml pick it.
      - name: Pick the Python version
        id: python
        run: python3 scripts/ci_versions.py | grep '^newest-version=' >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.newest-version }}

      - name: Install Rust
        # Toolchain comes from rust-toolchain.toml.
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""

      # The profiling profile is release with debug symbols. CodSpeed then
      # shows the Rust functions in its flame graphs.
      - name: Install dependencies and build the extension
        run: |
          uv sync --all-extras --no-install-project --python "$(command -v python)"
          uv run --no-sync maturin develop --profile profiling

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: uv run --no-sync pytest python/benchmark/http_benchmark.py -p no:django --codspeed
          mode: simulation
